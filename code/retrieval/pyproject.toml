[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragfusion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["srclight>=0.15.1", "fastapi>=0.115", "uvicorn>=0.30", "packaging>=23", "bm25s>=0.3.9", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ragfusion*"]

[tool.pytest.ini_options]
# tests are not shipped
pythonpath = ["."]
